<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecipeBook</title>
    <meta name="description" content="Discover delicious recipes for every occasion.">

    <meta property="og:type" content="website">
    <meta property="og:title" content="RecipeBook">
    <meta property="og:description" content="Discover delicious recipes for every occasion.">
    <meta property="og:url" content="https://jouvens-cyber.github.io/wdd131/recipes/">
    <meta property="og:image" content="https://jouvens-cyber.github.io/wdd131/recipes/images/social-preview-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Apple crisp topped with vanilla ice cream">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="RecipeBook">
    <meta name="twitter:description" content="Discover delicious recipes for every occasion.">
    <meta name="twitter:image" content="https://jouvens-cyber.github.io/wdd131/recipes/images/social-preview-image.png">

    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&amp;display=swap">
    <link rel="stylesheet" href="recipes.css">

    <script src="recipes.js" defer></script>
</head>
<body>
    <header>
        <div class="brand">
            <img src="images/recipe-book.png" alt="">
            <h1>RecipeBook</h1>
        </div>

        <form class="recipe-search" role="search">
            <input id="search" type="search" name="q"
                aria-label="Find a recipe" placeholder="Find a recipe">

            <button type="submit" aria-label="Search recipes">
                <img src="images/search.svg" alt="">
            </button>
        </form>
    </header>

    <main id="recipe-container"></main>

    <footer>
        <a class="attribution" href="https://www.flaticon.com/free-icons/recipe">
            Recipe icons created by Freepik - Flaticon
        </a>

        <div class="social">
            <!-- Social media icons provided by AlfredoCreates -->
            <a href="https://www.instagram.com/">
                <img src="images/instagram_icon.svg" alt="Instagram">
            </a>
            <a href="https://www.youtube.com/">
                <img src="images/youtube_icon.svg" alt="YouTube">
            </a>
            <a href="https://www.pinterest.com/">
                <img src="images/pinterest_icon.svg" alt="Pinterest">
            </a>
        </div>
    </footer>
</body>
</html>
