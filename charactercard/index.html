<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="An interactive fantasy character card built with JavaScript objects.">

  <title>Character Card | WDD 131</title>

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Fantasy Character Card">
  <meta property="og:description" content="Meet Snortleblat, a fantasy character who can level up and take damage.">
  <meta property="og:url" content="https://jouvens-cyber.github.io/wdd131/charactercard/">
  <meta property="og:image" content="https://andejuli.github.io/wdd131/character_card/snortleblat.webp">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Fantasy Character Card">
  <meta name="twitter:description" content="An interactive fantasy character card made with JavaScript.">
  <meta name="twitter:image" content="https://andejuli.github.io/wdd131/character_card/snortleblat.webp">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%89%3C/text%3E%3C/svg%3E">

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <main>
    <article class="card">
      <img
        id="characterImage"
        class="image"
        src="https://andejuli.github.io/wdd131/character_card/snortleblat.webp"
        alt="Snortleblat the fantasy swamp beast"
        width="400"
        height="400"
      >

      <h1 id="characterName" class="name"></h1>

      <div class="stats">
        <p>Class: <span id="characterClass"></span></p>
        <p>Level: <span id="characterLevel"></span></p>
        <p>Health: <span id="characterHealth"></span></p>
      </div>

      <div class="buttons">
        <button id="attacked" type="button">Attacked</button>
        <button id="levelUp" type="button">Level Up</button>
      </div>

      <p id="message" role="status" aria-live="polite"></p>
    </article>
  </main>
</body>
</html>
